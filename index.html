<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentolaulu - Heavy & Baritoni Edition</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 10px; margin: 0; }
        .card { background: #1e1e1e; max-width: 650px; margin: 0 auto; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        button { background: #e50914; color: white; border: none; padding: 10px 14px; font-size: 14px; border-radius: 6px; cursor: pointer; margin: 4px; font-weight: bold; }
        button:hover { background: #b20710; }
        
        .stats-panel { background: #262626; border: 1px solid #444; padding: 8px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-around; font-size: 13px; color: #ffca28; font-weight: bold; }
        .report-btn { background: #0288d1; width: 100%; font-size: 14px; margin-top: 5px; }
        .report-btn:hover { background: #01579b; }

        .recorder-panel { background: #2a2a2a; border: 1px solid #555; padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center; }
        audio { margin-top: 8px; width: 100%; height: 35px; }

        .controls-panel { background: #262626; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-around; flex-wrap: wrap; }
        .control-group { margin: 5px 10px; text-align: left; }
        .control-group label { font-size: 13px; color: #00e5ff; display: block; font-weight: bold; margin-bottom: 3px; }

        .toggles-panel { background: #1a1a1a; padding: 8px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: center; gap: 15px; font-size: 13px; color: #ccc; }

        .exercise-container { max-height: 250px; overflow-y: auto; border: 1px solid #444; border-radius: 8px; padding: 8px; background: #181818; margin-top: 10px; text-align: left; }
        .category-title { font-size: 13px; color: #ffca28; margin: 10px 0 5px 2px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 2px; }
        .exercise-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px; margin-bottom: 10px; }
        
        .exercise-btn { background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; text-align: left; font-size: 11px; cursor: pointer; }
        .exercise-btn:hover { background: #3a3a3a; border-color: #00e5ff; }
        .exercise-btn strong { display: block; font-size: 12px; }
        
        .btn-heavy { border-color: #ff3d00; }
        .btn-heavy strong { color: #ff6e40; }
        .btn-harmony { border-color: #9c27b0; }
        .btn-harmony strong { color: #e1bee7; }
        .btn-warmup { border-color: #00bcd4; }
        .btn-warmup strong { color: #80deea; }
        .btn-retro { border-color: #ff9800; }
        .btn-retro strong { color: #ffb74d; }

        canvas { background: #181818; border: 2px solid #333; border-radius: 10px; width: 100%; height: 230px; display: block; margin: 10px 0; }
    </style>
</head>
<body>

<div class="card">
    <h2>Rentolaulu 🎤 (Heavy & Baritoni)</h2>
    
    <div class="stats-panel">
        <div>🔥 Striikki: <span id="streakCount">0</span> pvä</div>
        <div>🏆 Treenit: <span id="totalCount">0</span> kpl</div>
        <div>⏱️ Pito/Särö-aika: <span id="holdTimeCount">0</span> s</div>
    </div>

    <button onclick="startListening()" style="background: #2e7d32; width: 100%; font-size: 16px; margin-bottom: 5px;">🎤 Käynnistä Mikrofoni & Ääni</button>
    
    <div class="recorder-panel">
        <div style="font-size: 13px; margin-bottom: 5px; color: #ffca28; font-weight: bold;">🎙️ Oma Äänitallennin:</div>
        <button id="recordBtn" onclick="toggleRecording()" style="background: #d32f2f;">🔴 Aloita Nauhoitus</button>
        <div id="recordingStatus" style="font-size: 11px; color: #aaa; margin-top: 4px;">Ei nauhoiteta</div>
        <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>

    <button onclick="copySessionReport()" class="report-btn">📋 Kopioi treeniraportti tekoälyvalmentajalle</button>

    <div class="toggles-panel" style="margin-top: 10px;">
        <label><input type="checkbox" id="voiceToggle" checked> 🔊 Tekoälytsemppari</label>
        <label><input type="checkbox" id="guideVoiceToggle" checked> 🎵 Apulaulu (Opaste)</label>
    </div>

    <div class="controls-panel">
        <div class="control-group">
            <label for="speedSlider">🚀 Liukunopeus: <span id="speedVal">Hidas (1.5)</span></label>
            <input type="range" id="speedSlider" min="0.5" max="4" step="0.5" value="1.5" oninput="updateControlLabels()">
        </div>
        <div class="control-group">
            <label for="lengthSlider">📏 Nuotin pituus & Tauot: <span id="lengthVal">Pitkä</span></label>
            <input type="range" id="lengthSlider" min="1" max="4" step="1" value="3" oninput="updateControlLabels()">
        </div>
    </div>

    <canvas id="gameCanvas" width="600" height="230"></canvas>

    <h3>Valitse laulettavaa:</h3>
    <div class="exercise-container" id="containerBox"></div>
</div>

<script>
let audioCtx;
let userPitch = null;
let currentRMS = 0;
let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let currentExerciseIsScream = false;

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let lastSpokenTime = 0;
let lastPhraseIndex = -1;

let sessionLog = {
    startTime: new Date(),
    completedExercises: [],
    totalHoldSeconds: 0
};

let stats = JSON.parse(localStorage.getItem('rentolaulu_stats')) || { total: 0, streak: 0, lastDate: "", holdTime: 0 };
updateStatsDisplay();

function updateStatsDisplay() {
    document.getElementById("totalCount").innerText = stats.total;
    document.getElementById("streakCount").innerText = stats.streak;
    document.getElementById("holdTimeCount").innerText = Math.round(stats.holdTime || 0);
}

function recordExerciseCompleted(title) {
    let today = new Date().toISOString().slice(0, 10);
    stats.total += 1;
    sessionLog.completedExercises.push(title);

    if (stats.lastDate !== today) {
        let yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        let yStr = yesterday.toISOString().slice(0, 10);

        if (stats.lastDate === yStr) {
            stats.streak += 1;
        } else {
            stats.streak = 1;
        }
        stats.lastDate = today;
    }
    
    localStorage.setItem('rentolaulu_stats', JSON.stringify(stats));
    updateStatsDisplay();
}

function copySessionReport() {
    let durationMins = Math.round((new Date() - sessionLog.startTime) / 1000 / 60);
    let exercisesList = sessionLog.completedExercises.length > 0 
        ? sessionLog.completedExercises.join(", ") 
        : "Ei vielä loppuun asti suoritettuja treenejä.";

    let reportText = `--- 🎤 RENTOLAULU TREENIRAPORTTI ---
⏱ Treenin kesto: ${durationMins} min
🔥 Päivä-striikki: ${stats.streak} päivää
🏆 Tehdyt harjoitukset yhteensä: ${stats.total} kpl
✅ Tällä sessiolla treenattu: ${exercisesList}
🧘‍♂️ Pito- ja säröaika yhteensä: ${Math.round(sessionLog.totalHoldSeconds)} sekuntia
---------------------------------------`;

    navigator.clipboard.writeText(reportText).then(() => {
        alert("Raportti kopioitu leikepöydälle! Voit liimata sen valmentajalle.");
    }).catch(err => {
        alert("Kopiointi epäonnistui. Voit meilata havainnot suoraan chattiin!");
    });
}

const praisePhrases = [
    "Upea sointi!", "Täydellinen pito!", "Pallea kantaa!", "Hieno matala sointi!",
    "Juuri noin, rentona!", "Ääni kestää hienosti!", "Puhdas paine!", "Loistavaa säröä!"
];

function speak(text) {
    if (!document.getElementById("voiceToggle").checked) return;
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'fi-FI';
        speech.rate = 1.1;
        window.speechSynthesis.speak(speech);
    }
}

function getRandomPraise() {
    let newIdx;
    do {
        newIdx = Math.floor(Math.random() * praisePhrases.length);
    } while (newIdx === lastPhraseIndex);
    lastPhraseIndex = newIdx;
    return praisePhrases[newIdx];
}

const noteFreqs = {
    "E2": 82.41, "F2": 87.31, "G2": 98.00, "A2": 110.00, "B2": 123.47,
    "C3": 130.81, "D3": 146.83, "E3": 164.81, "G3": 196.00, "A3": 220.00
};

const noteYMap = {
    "E2": 210, "F2": 200, "G2": 190, "A2": 175, "B2": 160,
    "C3": 145, "D3": 125, "E3": 105, "G3": 75, "A3": 55
};

const categories = [
    {
        title: "🔥 Heavy & Särölaulu (Raskas Palleatuki & Fry)",
        type: "heavy",
        items: [
            { title: "Vaihe 1: Palleasuhina 'SSS' (Tasa-ilma 15s)", seq: ["E2"], isHold: true, isScream: true },
            { title: "Vaihe 2: Fry-Narina (Ruostunut ovi - Baritoni)", seq: ["E2"], isHold: true, isScream: true },
            { title: "Vaihe 3: Fry + Palleatuki (Tasainen särö-hold)", seq: ["E2", "G2"], isHold: true, isScream: true },
            { title: "Vaihe 4: Rock-Särö venytys (Suu auki)", seq: ["E2", "A2"], isHold: true, isScream: true }
        ]
    },
    {
        title: "🧘‍♂️ Matalat Harmoniavenytykset (Baritoni & Suu Auki)",
        type: "harmony",
        items: [
            { title: "MMM / AAA - Matala E2 Pitkä venytys", seq: ["E2"], isHold: true },
            { title: "Nouseva Harmonia (E2 -> G2 -> A2 -> C3)", seq: ["E2", "G2", "A2", "C3"], isHold: true },
            { title: "Laskeva Harmonia (C3 -> A2 -> G2 -> E2)", seq: ["C3", "A2", "G2", "E2"], isHold: true },
            { title: "Syvä Ultra-venytys E2 (Palleatuki)", seq: ["E2", "E2"], isHold: true }
        ]
    },
    {
        title: "💨 Lämmittelyt & Huulipärinät (Prrr / Brrr)",
        type: "warmup",
        items: [
            { title: "Huulipärinä (Prrr) - Matala E2-Asteikko", seq: ["E2", "G2", "A2", "G2", "E2"] },
            { title: "Sireeni-liuku (Uu-oo) Matalalta", seq: ["E2", "G2", "B2", "E3"], isHold: true }
        ]
    },
    {
        title: "📻 Heavy & Rock hitit (Matala baritoni)",
        type: "retro",
        items: [
            { title: "Dingo - Autiotalo", seq: ["E2", "G2", "A2", "A2", "G2", "E2", "D3", "E3"] },
            { title: "Europe - Final Countdown", seq: ["B2", "A2", "B2", "E2", "C3", "B2", "C3", "B2"] }
        ]
    }
];

const containerBox = document.getElementById("containerBox");

categories.forEach(cat => {
    let titleEl = document.createElement("div");
    titleEl.className = "category-title";
    titleEl.innerText = cat.title;
    containerBox.appendChild(titleEl);

    let gridEl = document.createElement("div");
    gridEl.className = "exercise-grid";

    cat.items.forEach(ex => {
        let btn = document.createElement("button");
        btn.className = `exercise-btn btn-${cat.type}`;
        btn.innerHTML = `<strong>${ex.title}</strong>`;
        btn.onclick = () => startExercise(ex);
        gridEl.appendChild(btn);
    });

    containerBox.appendChild(gridEl);
});

let activeNotes = [];
let isRunning = false;
let exerciseTimer = null;

function updateControlLabels() {
    let spd = document.getElementById("speedSlider").value;
    document.getElementById("speedVal").innerText = `(${spd})`;
    let len = document.getElementById("lengthSlider").value;
    document.getElementById("lengthVal").innerText = len == 1 ? "Lyhyt" : len == 2 ? "Normaali" : len == 3 ? "Pitkä (+Tauot)" : "Erittäin pitkä venytys";
}

function playGuideNote(freq, duration) {
    if (!audioCtx || !document.getElementById("guideVoiceToggle").checked || currentExerciseIsScream) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function startExercise(ex) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    currentExerciseIsScream = !!ex.isScream;

    if (currentExerciseIsScream) {
        speak(`Valittu ${ex.title}. Muista: Jos kurkkua kaivertaa tai polttaa, lopeta heti. Paine tulee palleasta!`);
    } else {
        speak(`Valittu: ${ex.title}`);
    }

    activeNotes = [];
    let speed = parseFloat(document.getElementById("speedSlider").value);
    let lengthMult = parseInt(document.getElementById("lengthSlider").value);
    
    let baseWidth = ex.isHold ? (220 * lengthMult) : (80 * lengthMult);
    let gap = (180 * lengthMult);
    let startX = 600;

    ex.seq.forEach((note, i) => {
        let soundDuration = (baseWidth / (speed * 60)) + 0.3;
        let noteX = startX + (i * (baseWidth + gap));

        activeNotes.push({
            name: currentExerciseIsScream ? "🔥 HEAVY HOLD" : note,
            freq: noteFreqs[note] || 82.41,
            x: noteX,
            y: currentExerciseIsScream ? 115 : (noteYMap[note] || 150),
            width: baseWidth,
            hit: false,
            action: () => playGuideNote(noteFreqs[note] || 82.41, soundDuration)
        });
    });

    isRunning = true;

    if (exerciseTimer) clearTimeout(exerciseTimer);
    let completionTime = ((startX + (ex.seq.length * (baseWidth + gap))) / speed) * 18;
    exerciseTimer = setTimeout(() => {
        if (isRunning) {
            recordExerciseCompleted(ex.title);
        }
    }, completionTime);

    requestAnimationFrame(gameLoop);
}

let lastFrameTime = Date.now();

function gameLoop() {
    if (!isRunning) return;

    let now = Date.now();
    let deltaTime = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    let speed = parseFloat(document.getElementById("speedSlider").value);

    ctx.fillStyle = "#181818";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#252525";
    ctx.lineWidth = 1;
    for (let y = 20; y < canvas.height; y += 20) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }

    const hitX = 120;
    ctx.strokeStyle = currentExerciseIsScream ? "#ff3d00" : "#00e5ff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hitX, 0);
    ctx.lineTo(hitX, canvas.height);
    ctx.stroke();

    activeNotes.forEach(n => {
        n.x -= speed;

        if (Math.abs(n.x - hitX) < (speed + 1) && !n.hit) {
            n.action();
            n.hit = true;
        }

        let isUserMatching = false;
        
        // Heavy-screamissä mittaus perustuu tasaisesti palleasta tulevaan ilmavirtaan (RMS-voimakkuus)
        if (currentExerciseIsScream) {
            if (currentRMS > 0.015 && n.x <= hitX && (n.x + n.width) >= hitX) {
                isUserMatching = true;
            }
        } else if (userPitch && Math.abs(1200 * Math.log2(userPitch / n.freq)) < 65) {
            if (n.x <= hitX && (n.x + n.width) >= hitX) {
                isUserMatching = true;
            }
        }

        if (isUserMatching) {
            sessionLog.totalHoldSeconds += deltaTime;
            stats.holdTime = (stats.holdTime || 0) + deltaTime;
            localStorage.setItem('rentolaulu_stats', JSON.stringify(stats));
            updateStatsDisplay();

            if (now - lastSpokenTime > 6000) {
                speak(getRandomPraise());
                lastSpokenTime = now;
            }
        }

        ctx.fillStyle = isUserMatching ? (currentExerciseIsScream ? "#ff5722" : "#9c27b0") : (currentExerciseIsScream ? "#d84315" : "#00e5ff");
        ctx.shadowBlur = isUserMatching ? 15 : 0;
        ctx.shadowColor = currentExerciseIsScream ? "#ff5722" : "#9c27b0";

        ctx.beginPath();
        ctx.roundRect(n.x, n.y - 12, n.width, 24, 6);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "#fff";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(n.name, n.x + 6, n.y + 4);
    });

    if (currentRMS > 0.008) {
        let userY = 115;
        if (!currentExerciseIsScream && userPitch) {
            userY = 210 - ((Math.log2(userPitch / 82.41)) * 95);
            if (userY < 5) userY = 5;
            if (userY > 225) userY = 225;
        }

        ctx.fillStyle = currentExerciseIsScream ? "#ff6e40" : "#ffca28";
        ctx.shadowBlur = 12;
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath();
        ctx.arc(hitX, userY, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    requestAnimationFrame(gameLoop);
}

async function startListening() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    speak("Mikrofoni valmiina. Valitse harjoitus alta!");

    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(mediaStream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        const buffer = new Float32Array(analyser.fftSize);
        
        function processAudio() {
            analyser.getFloatTimeDomainData(buffer);
            
            // Lasketaan RMS (ilmanpaine) heavy-scream & pallea-suhinaa varten
            let sum = 0;
            for (let i = 0; i < buffer.length; i++) {
                sum += buffer[i] * buffer[i];
            }
            currentRMS = Math.sqrt(sum / buffer.length);

            let freq = autoCorrelateBaritone(buffer, audioCtx.sampleRate);
            userPitch = (freq !== -1) ? freq : null;
            requestAnimationFrame(processAudio);
        }
        processAudio();
    } catch (err) {
        alert("Mikrofoniyhteys epäonnistui.");
    }
}

function toggleRecording() {
    let btn = document.getElementById("recordBtn");
    let status = document.getElementById("recordingStatus");
    let player = document.getElementById("audioPlayer");

    if (!isRecording) {
        if (!mediaStream) {
            alert("Käynnistä ensin mikrofoni yläpuolelta!");
            return;
        }
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream);
        
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            let blob = new Blob(recordedChunks, { type: 'audio/webm' });
            let audioURL = URL.createObjectURL(blob);
            player.src = audioURL;
            player.style.display = "block";
        };

        mediaRecorder.start();
        isRecording = true;
        btn.innerText = "⏹️ Pysäytä Nauhoitus";
        btn.style.background = "#ff9800";
        status.innerText = "🔴 Nauhoitetaan laulua...";
    } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.innerText = "🔴 Uusi Nauhoitus";
        btn.style.background = "#d32f2f";
        status.innerText = "✅ Nauhoitus valmis! Kuuntele alta:";
    }
}

function autoCorrelateBaritone(buf, sampleRate) {
    let SIZE = buf.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) {
        let val = buf[i]; rms += val * val;
    }
    rms = Math.sqrt(rms / SIZE);
    
    if (rms < 0.008) return -1;

    let r1 = 0, r2 = SIZE - 1, thres = 0.15;
    for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
    }
    for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
    }
    buf = buf.slice(r1, r2); SIZE = buf.length;
    let c = new Array(SIZE).fill(0);
    for (let i =
